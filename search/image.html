<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Images</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ลิงก์มุมขวาบนสำหรับย้อนกลับไปหน้าค้นหาหลัก -->
    <div class="nav-bar">
        <a href="index.html">Google Search</a>
    </div>

    <div class="main-content">
        <!-- โลโก้ที่มีคำว่า images กำกับไว้ -->
        <div class="logo">
            <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
            <span style="font-size: 18px; color: #4285f4; font-weight: normal; margin-left: 5px;">images</span>
        </div>

        <form action="https://www.google.com/search" method="get" class="search-box">
            <!-- ซ่อนค่า tbm=isch เพื่อให้ Google เปิดหน้าค้นหารูป -->
            <input type="hidden" name="tbm" value="isch">
            <input type="text" name="q" class="search-input" autofocus>
            
            <div class="buttons">
                <input type="submit" value="Search Images" class="btn">
            </div>
        </form>
    </div>
</body>
</html>
