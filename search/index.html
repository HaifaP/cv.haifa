<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ลิงก์มุมขวาบนตามเกณฑ์ของ CS50 -->
    <div class="nav-bar">
        <a href="image.html">Images</a>
        <a href="advanced.html">Advanced Search</a>
    </div>

    <!-- ส่วนเนื้อหาตรงกลางหน้า -->
    <div class="main-content">
        <!-- โลโก้เลียนแบบสีตัวอักษรของ Google -->
        <div class="logo">
            <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
        </div>

        <!-- ฟอร์มส่งค่าค้นหาไปที่เซิร์ฟเวอร์ของ Google -->
        <form action="https://www.google.com/search" method="get" class="search-box">
            <!-- name="q" คือตัวแปรคำค้นหา (Query) ที่ Google ต้องการ -->
            <input type="text" name="q" class="search-input" autofocus>
            
            <div class="buttons">
                <input type="submit" value="Google Search" class="btn">
                <!-- name="btnI" คือคำสั่งของ Google สำหรับปุ่ม I'm Feeling Lucky -->
                <input type="submit" name="btnI" value="I'm Feeling Lucky" class="btn">
            </div>
        </form>
    </div>
</body>
</html>
